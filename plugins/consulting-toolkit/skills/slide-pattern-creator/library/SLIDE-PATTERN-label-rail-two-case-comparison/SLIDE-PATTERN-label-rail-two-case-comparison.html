<!DOCTYPE html>

<title>SLIDE-PATTERN-label-rail-two-case-comparison</title>
<style>
  body {

    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    font-family: sans-serif;
  }
  .slide {
    width: 960px;
    height: 540px;
    background: #FFFFFF;
    border: 1px solid #CCCCCC;
    position: relative;
    overflow: hidden;
    margin-bottom: 8px;
    display: flex;
    flex-direction: column;
  }
  .area-label {
    font-size: 11px;
    color: #999999;

    margin-bottom: 4px;
  }
  .title-area {
    padding: 14px 40px 12px;
    border-bottom: 1px dashed #CCCCCC;
    flex-shrink: 0;
    background: #FAFAFA;
  }
  .content-area {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  .case-column {
    width: 50%;

    flex-direction: column;

  }
  .case-column:first-child { border-right: 1px solid #CCCCCC; }

    font-size: 13px;
    font-weight: bold;
    color: #333333;
    border-bottom: 1px solid #333333;
    padding-bottom: 6px;
  }
  .info-row {
    display: flex;
    flex: 1;
    gap: 8px;
  }
  .rail-label {
    width: 22%;
    background: #333333;
    color: #FFFFFF;
    border-radius:0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    text-align: center;
    padding: 6px;
  }
  .rail-body {
    width: 78%;
    font-size: 11px;
    color: #333333;
    line-height: 1.6;
  }
  .placeholder-box {
    background: #F0F0F0;
    border: 1px dashed #CCCCCC;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #AAAAAA;
    font-size: 11px;
    height: 60px;
    margin-top: 4px;
  }
  .source-note {
    font-size: 9px;
    color: #999999;
  }
</style>
</head>
